#spring.application.name=hospital-appointment
spring:
  datasource:
    url: jdbc:h2:mem:hospitaldb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key:
        chat:
          model: gemini-2.5-flash
          temperature: 0.3